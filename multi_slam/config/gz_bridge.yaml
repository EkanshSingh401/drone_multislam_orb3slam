# -------- Ground truth (added for ATE/RPE evaluation) --------
# Gazebo publishes every model's true pose on <world>/dynamic_pose/info as a
# gz.msgs.Pose_V. ros_gz_bridge maps Pose_V -> tf2_msgs/msg/TFMessage, so this
# arrives as a TF stream whose child_frame_id for this drone is "x500_depth_1".
# Kept on a dedicated topic (NOT /tf) so it can never be confused with, or
# compete against, the SLAM TF tree.
- ros_topic_name: "ground_truth/pose_info"
  gz_topic_name: "/world/forest/dynamic_pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Simulation clock, required for use_sim_time:=true on every node.
- ros_topic_name: "/clock"
  gz_topic_name: "/world/forest/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
