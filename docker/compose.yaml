# =============================================================================
# Single-UAV ORB-SLAM3 + COVINS reproduction, two containers on one network.
#
#   covins-backend : ROS Melodic, COVINS backend, listens on TCP 9033
#   sim            : ROS 2 Jazzy, Gazebo Harmonic (headless), PX4 SITL,
#                    ros_gz_bridge, ORB-SLAM3 RGB-D agent
#
# The agent reaches the backend over covins_comm's own TCP socket, NOT via ROS
# topics or ros1_bridge: ORB_SLAM3/src/System.cc constructs
# Communicator(covins_params::sys::server_ip, covins_params::sys::port) and
# CommunicatorBase::ConnectToServer() resolves that address with getaddrinfo(),
# so the Compose service name "covins-backend" works directly as server_ip.
#
# Run from the repository root:  docker compose -f docker/compose.yaml up -d
# =============================================================================
name: drone-covins

networks:
  slamnet:
    driver: bridge

volumes:
  covins_output:

services:
  covins-backend:
    build:
      context: ..
      dockerfile: docker/covins/Dockerfile
      platforms: ["linux/amd64"]
      args:
        # See docker/PATCHES.md §19c: these builds are memory-bound, and the two
        # images must not be built concurrently on a 16 GB VM. Raised to 8 on the
        # 64 GB amd64 host (PATCHES.md §40).
        NR_JOBS: "8"
    image: covins-backend:melodic-amd64
    container_name: covins-backend
    hostname: covins-backend
    networks: [slamnet]
    ports:
      - "9033:9033"     # covins_comm TCP (exposed for host-side debugging)
      - "6902:6902"     # noVNC -> COVINS RViz
      - "5902:5902"     # raw VNC -> COVINS RViz
    environment:
      START_ROSCORE: "1"
      START_VNC: "1"
      DISPLAY: ":98"
      VNC_PORT: "5902"
      NOVNC_PORT: "6902"
      ROS_MASTER_URI: "http://covins-backend:11311"
      ROS_HOSTNAME: "covins-backend"
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      # Both services mount the SAME host config_comm.yaml, so the agent and
      # the backend cannot disagree about the comm parameters.
      - ../covins/covins_comm/config/config_comm.yaml:/root/covins_ws/src/covins/covins_comm/config/config_comm.yaml:ro
      - ../covins/covins_backend/config/config_backend.yaml:/root/covins_ws/src/covins/covins_backend/config/config_backend.yaml:ro
      # COVINS writes its optimised keyframe trajectory here (TUM format, per
      # sys.trajectory_format) -- this is what gets evaluated against ground truth.
      - covins_output:/root/covins_ws/src/covins/covins_backend/output
      - ./out:/out
    # init: true runs tini as PID 1 so orphaned children get REAPED. Without it
    # the container's PID 1 is "sleep infinity", which never calls wait(), and
    # every killed gz/px4/bridge/SLAM process left a <defunct> entry behind --
    # 37 zombies accumulated across a five-run experiment. They cost no CPU, but
    # they made `pgrep -c` count dead processes and sent me chasing a phantom
    # "leaked process" explanation for a real-time-factor decay.
    init: true
    shm_size: "1gb"
    stop_grace_period: 10s
    # Keep the container alive; the backend node is started via
    # docker/scripts/run_backend.sh so its stdout stays inspectable.
    command: ["sleep", "infinity"]

  sim:
    build:
      context: ..
      dockerfile: docker/sim/Dockerfile
      platforms: ["linux/amd64"]
      args:
        # Applies to PX4 / Pangolin / ORB-SLAM3, which are fine at -j6 (now -j16 on the 64 GB amd64 host, PATCHES.md §40). The
        # colcon step is pinned to -j1 inside the Dockerfile regardless; see
        # docker/PATCHES.md §19c.
        NJOBS: "16"
    image: drone-sim:jazzy-amd64
    container_name: drone-sim
    hostname: sim
    networks: [slamnet]
    depends_on: [covins-backend]
    ports:
      - "6901:6901"     # noVNC -> RViz 2
      - "5901:5901"     # raw VNC -> RViz 2
    environment:
      # Rewrites sys.server_ip in the agent's config_comm.yaml at startup.
      COVINS_SERVER_IP: "covins-backend"
      START_VNC: "1"
      DISPLAY: ":99"
      VNC_PORT: "5901"
      NOVNC_PORT: "6901"
      ROS_DOMAIN_ID: "55"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      # amd64 host with a GTX 1080 Ti (PATCHES.md §40): Gazebo's sensor
      # pipeline renders offscreen via EGL on the NVIDIA GPU. The Mac-era
      # LIBGL_ALWAYS_SOFTWARE / GALLIUM_DRIVER=llvmpipe overrides are removed.
      # "graphics" makes nvidia-container-toolkit inject libEGL_nvidia and the
      # glvnd vendor file. RViz on Xvfb still renders in software (Xvfb has no GLX
      # on the GPU), which does not affect sensor rendering.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
    volumes:
      - ../covins/covins_comm/config/config_comm.yaml:/opt/covins-config/config_comm.yaml:ro
      - ./out:/out
    # Fast DDS shared-memory transport needs real /dev/shm headroom; the 64 MB
    # Docker default causes dropped image samples at 640x480.
    # init: true runs tini as PID 1 so orphaned children get REAPED. Without it
    # the container's PID 1 is "sleep infinity", which never calls wait(), and
    # every killed gz/px4/bridge/SLAM process left a <defunct> entry behind --
    # 37 zombies accumulated across a five-run experiment. They cost no CPU, but
    # they made `pgrep -c` count dead processes and sent me chasing a phantom
    # "leaked process" explanation for a real-time-factor decay.
    init: true
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, compute, utility]
    stop_grace_period: 10s
    command: ["sleep", "infinity"]
