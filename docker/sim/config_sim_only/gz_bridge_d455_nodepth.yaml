# GENERATED by docker/sim/tools/gen_d455_sim.py -- do not edit by hand.
#
# ros_gz_bridge config for the D455-mirror rig.
#
# The ROS topic names are deliberately IDENTICAL to the Jetson/D455 stack, so
# OpenVINS configs and launch files transfer unchanged. "image_rect_raw" is
# accurate rather than aspirational: the simulated cameras have zero distortion,
# so the raw images ARE rectified.
#
# The gz-side names are the SCOPED sensor topics. The model SDF deliberately
# sets no <topic> override -- see docker/PATCHES.md section 21 for what happens
# when it does (PX4's OakD-Lite sets <topic>depth_camera</topic>, which both
# moves the image off its scoped name AND relocates camera_info to /camera_info,
# where three cameras would collide).
#
# NOTE: the gz names embed world "forest" and model "x500_d455_nodepth_1".
# PX4 spawns "<PX4_SIM_MODEL minus gz_>_<instance>", so this matches
# PX4_SIM_MODEL=gz_x500_d455 with -i 1 in world forest.

# left IR, mono8, 848x480 @ 30 Hz
- ros_topic_name: "/camera/infra1/image_rect_raw"
  gz_topic_name: "/world/forest/model/x500_d455_nodepth_1/link/d455_link/sensor/infra1/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/infra1/camera_info"
  gz_topic_name: "/world/forest/model/x500_d455_nodepth_1/link/d455_link/sensor/infra1/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# right IR, mono8, 95 mm baseline from infra1
- ros_topic_name: "/camera/infra2/image_rect_raw"
  gz_topic_name: "/world/forest/model/x500_d455_nodepth_1/link/d455_link/sensor/infra2/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/infra2/camera_info"
  gz_topic_name: "/world/forest/model/x500_d455_nodepth_1/link/d455_link/sensor/infra2/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# 200 Hz, noise model per D455_SIM_CALIBRATION.md
- ros_topic_name: "/camera/imu"
  gz_topic_name: "/world/forest/model/x500_d455_nodepth_1/link/d455_link/sensor/d455_imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Simulation clock -- required because every ROS 2 node runs use_sim_time:=true.
- ros_topic_name: "/clock"
  gz_topic_name: "/world/forest/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Ground truth for ATE/RPE. Kept OFF /tf so it can never compete with the SLAM
# TF tree. ros_gz_bridge drops the entity names in this conversion, so consumers
# select the model by INDEX (index 0) -- see docker/PATCHES.md section 27.
- ros_topic_name: "ground_truth/pose_info"
  gz_topic_name: "/world/forest/dynamic_pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
